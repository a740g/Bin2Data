name: Build & Package

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build target: "test" (all + test) or "release"'
        required: false
        type: string
        default: "test"
      artifact_prefix:
        description: "Prefix for uploaded artifact names"
        required: false
        type: string
        default: "Bin2Data-"

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build target"
        required: true
        type: choice
        options:
          - test
          - release
        default: "test"
      artifact_prefix:
        description: "Prefix for uploaded artifact names"
        required: false
        type: string
        default: "Bin2Data-"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64
            os: ubuntu-latest
            asset_pattern: "qb64pe_lnx-x64-*.tar.gz"
            exe_ext: ""
            archive_name: Bin2Data-linux-x64.tar.gz
          - name: Windows-x64
            os: windows-latest
            asset_pattern: "qb64pe_win-x64-*.7z"
            exe_ext: ".exe"
            archive_name: Bin2Data-windows-x64.zip
          - name: Windows-arm64
            os: windows-11-arm
            asset_pattern: "qb64pe_win-arm64-*.7z"
            exe_ext: ".exe"
            archive_name: Bin2Data-windows-arm64.zip
          - name: macOS-arm64
            os: macos-latest
            asset_pattern: "qb64pe_osx-*.tar.gz"
            exe_ext: ""
            archive_name: Bin2Data-macos-arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download QB64-PE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R QB64-Phoenix-Edition/QB64pe -p "${{ matrix.asset_pattern }}" --dir qb64_dl

      - name: Extract & Setup QB64-PE (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir qb64_src
          tar -xzf qb64_dl/*.tar.gz -C qb64_src
          SETUP_PATH=$(find qb64_src -name "setup_lnx.sh" -o -name "setup_osx.command" | head -n 1)
          if [ -z "$SETUP_PATH" ]; then
            echo "Error: Setup script not found in tarball."
            ls -R qb64_src
            exit 1
          fi
          SETUP_DIR=$(dirname "$SETUP_PATH")
          cd "$SETUP_DIR"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            chmod +x setup_lnx.sh
            ./setup_lnx.sh 1
          else
            chmod +x setup_osx.command
            ./setup_osx.command 1
          fi
          echo "QB64PE_BIN_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Extract QB64-PE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          7z x qb64_dl/*.7z -oqb64_src
          $subFolder = Get-ChildItem -Path qb64_src -Directory | Select-Object -First 1
          if ($subFolder) {
            Move-Item -Path "$($subFolder.FullName)\*" -Destination qb64_src\
          }
          echo "QB64PE_BIN_DIR=$((Get-Item qb64_src).FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export QB64PE_PATH=$(pwd -W)/qb64_src
            if [ -f "$QB64PE_PATH/internal/c/c_compiler/bin/mingw32-make.exe" ]; then
              MAKE_CMD="$QB64PE_PATH/internal/c/c_compiler/bin/mingw32-make.exe"
            else
              MAKE_CMD="mingw32-make"
            fi
          else
            export QB64PE_PATH="${{ env.QB64PE_BIN_DIR }}"
            MAKE_CMD="make"
          fi

          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            "$MAKE_CMD" release
          else
            "$MAKE_CMD" all
            "$MAKE_CMD" test
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p staging/Bin2Data
          cp -r docs screenshots source tests staging/Bin2Data/
          cp Bin2Data${{ matrix.exe_ext }} staging/Bin2Data/
          cp Makefile LICENSE.txt README.md staging/Bin2Data/
          rm -f staging/Bin2Data/source/Bin2Data staging/Bin2Data/source/Bin2Data.exe
          rm -f staging/Bin2Data/tests/*.bi staging/Bin2Data/tests/*.h staging/Bin2Data/tests/*.deflate
          find staging/Bin2Data \( -name ".git*" -o -name ".github" \) -exec rm -rf {} + 2>/dev/null || true
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x staging/Bin2Data/Bin2Data
            chmod +x staging/Bin2Data/tests/tests.sh
          fi

          cd staging
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "../${{ matrix.archive_name }}" Bin2Data
          else
            tar -czf "../${{ matrix.archive_name }}" Bin2Data
          fi
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}${{ matrix.name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
